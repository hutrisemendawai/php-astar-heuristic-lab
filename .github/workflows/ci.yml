name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: opcache, dom, mbstring, xml, xmlwriter
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer cs
      - run: composer stan
      - run: composer test
      - run: php -c php.ini.benchmark bin/benchmark --map-strategy=repair --n-seed=2 --iterations=3 --warmup=1 --out=/tmp/astar-benchmark-smoke
      - name: Lint game source
        run: find src/Game -name '*.php' -print0 | xargs -0 -r -n1 php -l
